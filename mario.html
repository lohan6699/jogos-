<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Mario Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }

        #placar {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #f1c40f;
        }

        /* Cenário do Jogo */
        #cenario {
            width: 800px;
            height: 400px;
            background: linear-gradient(to bottom, #5c94fc, #b8e8fc); /* Céu tipo Mario */
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Chão */
        #chao {
            width: 100%;
            height: 40px;
            background: #fcb47c; /* Cor de tijolo do Mario */
            border-top: 6px solid #d86800;
            position: absolute;
            bottom: 0;
        }

        /* Jogador (Mario) */
        #mario {
            width: 40px;
            height: 50px;
            background-color: #ff0000; /* Macacão Vermelho */
            border-radius: 5px;
            position: absolute;
            bottom: 40px; /* Alinhado com o chão */
            left: 50px;
            transition: bottom 0.1s ease-out; /* Suaviza o pulo */
        }
        /* Detalhe do boné/macacão do Mario com CSS */
        #mario::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 15px;
            background-color: #b00000;
            border-radius: 5px 5px 0 0;
        }
        #mario::after {
            content: '';
            position: absolute;
            bottom: 0; left: 5px;
            width: 30px; height: 25px;
            background-color: #0000ff
